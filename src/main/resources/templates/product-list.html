<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thực Đơn - CafePAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">☕ CafePAL</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" th:href="@{/}">Trang chủ</a>
                <a class="nav-link" th:href="@{/pos}">Order Tại Bàn (POS)</a>
                <a class="nav-link active" th:href="@{/products}">Quản lý Thực Đơn</a>
                <a class="nav-link" th:href="@{/users}">Quản lý Người Dùng</a>
            </div>
        </div>
    </nav>

    <!-- Main Table -->
    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 fw-bold">📋 Danh Sách Món / Thực Đơn</h5>
                <a th:href="@{/products/add}" class="btn btn-primary btn-sm">+ Thêm món mới</a>
            </div>

            <!-- Tìm kiếm -->
            <div class="card-body border-bottom bg-light">
                <form th:action="@{/products}" method="get" class="row g-2 align-items-center">
                    <div class="col-auto">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm theo tên món...">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-secondary btn-sm">Tìm kiếm</button>
                        <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">Làm mới</a>
                    </div>
                </form>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã</th>
                            <th>Hình ảnh</th>
                            <th>Tên món</th>
                            <th>Phân loại</th>
                            <th>Kích cỡ</th>
                            <th>Đơn giá</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${products}">
                            <td th:text="${item.maSanPham}">1</td>
                            <td>
                                <img th:src="${item.hinhAnh != null && !#strings.isEmpty(item.hinhAnh) ? item.hinhAnh : 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=100'}" 
                                     class="rounded border shadow-sm" style="width: 50px; height: 50px; object-fit: cover;" alt="Ảnh món">
                            </td>
                            <td><strong th:text="${item.tenSanPham}">Cà phê</strong></td>
                            <td><span class="badge bg-info text-dark" th:text="${item.loai}">Loại</span></td>
                            <td><span class="badge bg-secondary" th:text="${item.kichCo}">Size</span></td>
                            <td class="fw-bold text-success" th:text="${item.gia != null ? #numbers.formatDecimal(item.gia, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</td>
                            <td class="text-center">
                                <a th:href="@{/products/edit/{id}(id=${item.maSanPham})}" class="btn btn-warning btn-sm me-1">Sửa</a>
                                <a th:href="@{/products/delete/{id}(id=${item.maSanPham})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                            </td>
                        </tr>
                        <tr th:if="${products == null || #lists.isEmpty(products)}">
                            <td colspan="7" class="text-center py-4 text-muted">Chưa có món nào trong thực đơn.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
