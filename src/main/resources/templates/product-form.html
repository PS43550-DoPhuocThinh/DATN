<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Món - CafePAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">☕ CafePAL</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" th:href="@{/}">Trang chủ</a>
                <a class="nav-link" th:href="@{/pos}">Order Tại Bàn (POS)</a>
                <a class="nav-link active" th:href="@{/products}">Quản lý Thực Đơn</a>
                <a class="nav-link" th:href="@{/users}">Quản lý Người Dùng</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold text-center">
                        <span th:text="${product.maSanPham == null ? 'THÊM MÓN MỚI' : 'CẬP NHẬT MÓN'}">FORM MÓN</span>
                    </div>
                    <div class="card-body p-4">
                        <!-- Thêm enctype="multipart/form-data" để upload file -->
                        <form th:action="@{/products/save}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="maSanPham" th:value="${product.maSanPham}" />
                            <input type="hidden" name="hinhAnh" th:value="${product.hinhAnh}" />

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên món đồ uống / thức ăn:</label>
                                <input type="text" class="form-control" name="tenSanPham" th:value="${product.tenSanPham}" placeholder="VD: Cà phê muối" required>
                            </div>

                            <!-- Nút Tải Ảnh Lên -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Hình ảnh món:</label>
                                <input type="file" class="form-control" name="imageFile" accept="image/*" onchange="previewImage(event)">
                                <div class="mt-2 text-center" th:if="${product.hinhAnh != null && !#strings.isEmpty(product.hinhAnh)}">
                                    <small class="text-muted d-block mb-1">Ảnh hiện tại:</small>
                                    <img id="imagePreview" th:src="${product.hinhAnh}" class="rounded border" style="max-height: 120px; max-width: 100%; object-fit: cover;" alt="Ảnh món">
                                </div>
                                <div class="mt-2 text-center" th:if="${product.hinhAnh == null || #strings.isEmpty(product.hinhAnh)}">
                                    <img id="imagePreview" src="#" class="rounded border d-none" style="max-height: 120px; max-width: 100%; object-fit: cover;" alt="Xem trước ảnh">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phân loại (Loại):</label>
                                <input type="text" class="form-control" name="loai" th:value="${product.loai}" placeholder="VD: Cà phê, Trà sữa, Bánh..." required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Kích cỡ (Size):</label>
                                <select class="form-select" name="kichCo">
                                    <option value="S" th:selected="${product.kichCo == 'S'}">Size S (Nhỏ)</option>
                                    <option value="M" th:selected="${product.kichCo == 'M'}">Size M (Vừa)</option>
                                    <option value="L" th:selected="${product.kichCo == 'L'}">Size L (Lớn)</option>
                                    <option value="Standard" th:selected="${product.kichCo == 'Standard' || product.kichCo == null}">Tiêu chuẩn (Mặc định)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Đơn giá (VNĐ):</label>
                                <input type="number" step="1000" min="0" class="form-control" name="gia" th:value="${product.gia}" placeholder="VD: 35000" required>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/products}" class="btn btn-outline-secondary">Quay lại</a>
                                <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xem trước ảnh khi chọn -->
    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
