<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập nhật Người Dùng - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-5 d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-cup-hot-fill me-2 text-warning"></i> CafePAL
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/pos}"><i class="bi bi-grid-3x3-gap-fill me-1 text-info"></i> Bán Hàng (POS)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/products}"><i class="bi bi-cup-straw me-1 text-warning"></i> Quản lý Thực Đơn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/inventory}"><i class="bi bi-box-seam-fill me-1 text-success"></i> Quản lý Kho Hàng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-warning" th:href="@{/users}"><i class="bi bi-people-fill me-1"></i> Quản lý Người Dùng</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a th:href="@{/users}" class="btn btn-outline-light btn-sm px-3">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold text-center">
                        <span th:text="${user.maNguoiDung == null} ? 'THÊM NGƯỜI DÙNG MỚI' : 'CHỈNH SỬA NGƯỜI DÙNG'">FORM NGƯỜI DÙNG</span>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/users/save}" th:object="${user}" method="post">
                            <input type="hidden" th:field="*{maNguoiDung}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập:</label>
                                <input type="text" class="form-control bg-light" th:field="*{tenDangNhap}" required th:readonly="${user.maNguoiDung != null}" />
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mật khẩu:</label>
                                <input type="password" class="form-control" th:field="*{matKhau}" required />
                                <div class="form-text text-danger" th:if="${user.maNguoiDung != null}">* Nhập mật khẩu mới nếu muốn đổi</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Họ Tên:</label>
                                <input type="text" class="form-control" th:field="*{hoTen}" required />
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Vai Trò:</label>
                                <select class="form-select" th:field="*{vaiTro.maVaiTro}">
                                    <option th:each="role : ${roles}" 
                                            th:value="${role.maVaiTro}" 
                                            th:text="${role.tenVaiTro}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Hủy</a>
                                <button type="submit" class="btn btn-primary px-4">💾 Lưu dữ liệu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
