<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập nhật Người Dùng - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F5EBE0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cafe-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background-color: #FFF8F0; }
        .cafe-btn { background-color: #5D4037; color: white; }
        .cafe-btn:hover { background-color: #4E342E; color: white; }
    </style>
</head>
<body class="py-5">

    <div class="container col-md-6 col-lg-5">
        <div class="card cafe-card p-4">
            <h3 class="fw-bold text-center mb-4" style="color: #4E342E;" 
                th:text="${user.maNguoiDung == null} ? '➕ Thêm Người Dùng Mới' : '✏️ Chỉnh Sửa Người Dùng'"></h3>
            
            <form th:action="@{/users/save}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{maNguoiDung}" />
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên đăng nhập:</label>
                    <input type="text" class="form-control bg-light" th:field="*{tenDangNhap}" required th:readonly="${user.maNguoiDung != null}" />
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu:</label>
                    <input type="password" class="form-control" th:field="*{matKhau}" required />
                    <div class="form-text text-danger" th:if="${user.maNguoiDung != null}">* Nhập mật khẩu mới nếu muốn đổi</div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ Tên:</label>
                    <input type="text" class="form-control" th:field="*{hoTen}" required />
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Vai Trò:</label>
                    <select class="form-select" th:field="*{vaiTro.maVaiTro}">
                        <option th:each="role : ${roles}" 
                                th:value="${role.maVaiTro}" 
                                th:text="${role.tenVaiTro}">
                        </option>
                    </select>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a th:href="@{/users}" class="btn btn-secondary px-4">Hủy</a>
                    <button type="submit" class="btn cafe-btn px-4">💾 Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
