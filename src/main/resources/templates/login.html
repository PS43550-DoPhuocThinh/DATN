<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F5EBE0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; padding: 30px; border-radius: 16px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.06); background-color: #FFF8F0; }
        .cafe-btn { background-color: #5D4037; color: white; font-weight: bold; }
        .cafe-btn:hover { background-color: #4E342E; color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #4E342E;">☕ Cafe PAL</h3>
            <p class="text-muted small">Đăng nhập để tiếp tục</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
            Sai thông tin đăng nhập!
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small text-center">
            Đã đăng xuất thành công!
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Tên đăng nhập</label>
                <input type="text" name="tenDangNhap" class="form-control" placeholder="Nhập tên đăng nhập..." required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Mật khẩu</label>
                <input type="password" name="matKhau" class="form-control" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn cafe-btn w-100 py-2 mt-2">Đăng nhập</button>
        </form>

        <div class="text-center mt-3 small">
            <span class="text-muted">Chưa có tài khoản?</span>
            <a th:href="@{/register}" class="fw-semibold text-decoration-none" style="color: #5D4037;">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
