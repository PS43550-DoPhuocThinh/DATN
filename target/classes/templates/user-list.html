<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Người Dùng - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-5 d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-cup-hot-fill me-2 text-warning"></i> CafePAL
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/pos}"><i class="bi bi-grid-3x3-gap-fill me-1 text-info"></i> Bán Hàng (POS)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/products}"><i class="bi bi-cup-straw me-1 text-warning"></i> Quản lý Thực Đơn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" th:href="@{/inventory}"><i class="bi bi-box-seam-fill me-1 text-success"></i> Quản lý Kho Hàng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-warning" th:href="@{/users}"><i class="bi bi-people-fill me-1"></i> Quản lý Người Dùng</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a th:href="@{/}" class="btn btn-outline-light btn-sm px-3">
                        <i class="bi bi-arrow-left me-1"></i> Về trang chủ
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 fw-bold text-dark">👥 Danh Sách Người Dùng & Nhân Sự</h5>
                <a th:href="@{/users/add}" class="btn btn-success btn-sm">+ Thêm Người Dùng</a>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center">ID</th>
                                <th>Tên Đăng Nhập</th>
                                <th>Họ Tên</th>
                                <th>Vai Trò</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="text-center fw-bold" th:text="${u.maNguoiDung}">1</td>
                                <td th:text="${u.tenDangNhap}">admin</td>
                                <td th:text="${u.hoTen}">Quản trị viên</td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${u.vaiTro != null ? u.vaiTro.tenVaiTro : 'GUEST'}">ADMIN</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/users/edit/{id}(id=${u.maNguoiDung})}" class="btn btn-sm btn-warning me-1">✏️ Sửa</a>
                                    <a th:href="@{/users/delete/{id}(id=${u.maNguoiDung})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này không?');">🗑️ Xóa</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="5" class="text-center text-muted py-4">Chưa có người dùng nào trong hệ thống.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
