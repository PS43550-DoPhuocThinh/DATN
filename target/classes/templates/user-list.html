<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Người Dùng - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F5EBE0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-cafe { background-color: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .table-cafe thead { background-color: #5D4037; color: white; }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0" style="color: #4E342E;">👥 Danh sách Người dùng</h2>
            <div>
                <a href="/" class="btn btn-outline-secondary me-2">🏠 Về Trang Chủ</a>
                <a th:href="@{/users/add}" class="btn btn-success">➕ Thêm mới</a>
            </div>
        </div>
        
        <div class="table-responsive table-cafe">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="text-center">ID</th>
                        <th>Tên Đăng Nhập</th>
                        <th>Họ Tên</th>
                        <th>Vai Trò</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="text-center fw-bold" th:text="${u.maNguoiDung}"></td>
                        <td th:text="${u.tenDangNhap}"></td>
                        <td th:text="${u.hoTen}"></td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${u.vaiTro.tenVaiTro}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/users/edit/{id}(id=${u.maNguoiDung})}" class="btn btn-sm btn-warning">✏️ Sửa</a>
                            <a th:href="@{/users/delete/{id}(id=${u.maNguoiDung})}" 
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này không?');">🗑️ Xóa</a>
                        </td>
                    </tr>
                    <!-- Hiển thị khi danh sách trống -->
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center text-muted py-4">Chưa có người dùng nào trong hệ thống.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
