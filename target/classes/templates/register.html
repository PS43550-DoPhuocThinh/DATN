<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Cafe PAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F5EBE0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cafe-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background-color: #FFF8F0; }
        .cafe-btn { background-color: #5D4037; color: white; }
        .cafe-btn:hover { background-color: #4E342E; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container col-md-5 col-lg-4">
        <div class="card cafe-card p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: #4E342E;">📝 Đăng ký tài khoản</h2>
                <p class="text-muted">Trở thành thành viên của Cafe PAL</p>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên đăng nhập</label>
                    <input type="text" name="tenDangNhap" class="form-control" placeholder="Nhập tên đăng nhập..." required />
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Họ tên</label>
                    <input type="text" name="hoTen" class="form-control" placeholder="Nhập họ và tên..." required />
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" name="matKhau" class="form-control" placeholder="Tạo mật khẩu..." required />
                </div>
                
                <button type="submit" class="btn cafe-btn w-100 py-2">Đăng ký</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Đã có tài khoản?</span> 
                <a href="/login" class="text-decoration-none fw-bold" style="color: #5D4037;">Đăng nhập</a>
            </div>
        </div>
    </div>

</body>
</html>
