<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Món - CafePAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Header Navbar Chuẩn Toàn Hệ Thống -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-5 d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-cup-hot-fill me-2 text-warning"></i> CafePAL
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item" th:if="${isStaffOrAdmin}">
                        <a class="nav-link text-light" th:href="@{/pos}"><i class="bi bi-grid-3x3-gap-fill me-1 text-info"></i> Bán Hàng (POS)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-warning" th:href="@{/products}"><i class="bi bi-cup-straw me-1"></i> Quản lý Thực Đơn</a>
                    </li>
                    <li class="nav-item" th:if="${isStaffOrAdmin}">
                        <a class="nav-link text-light" th:href="@{/inventory}"><i class="bi bi-box-seam-fill me-1 text-success"></i> Quản lý Kho Hàng</a>
                    </li>
                    <li class="nav-item" th:if="${isAdmin}">
                        <a class="nav-link text-warning fw-semibold" th:href="@{/users}"><i class="bi bi-people-fill me-1"></i> Quản lý Người Dùng</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <div th:if="${currentUser != null}" class="text-light d-flex align-items-center">
                        <div class="me-3 text-end d-none d-sm-block">
                            <small class="text-secondary d-block" style="font-size: 11px;">Tài khoản</small>
                            <span class="fw-bold text-warning" th:text="${currentUser}">Admin</span>
                        </div>
                        <form th:action="@{/logout}" method="post" class="d-inline m-0">
                            <button class="btn btn-danger btn-sm px-3 rounded-pill" type="submit">
                                <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold text-center">
                        <span th:text="${product.maSanPham == null ? 'THÊM MÓN MỚI' : 'CẬP NHẬT MÓN'}">FORM MÓN</span>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/products/save}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="maSanPham" th:value="${product.maSanPham}" />
                            <input type="hidden" name="hinhAnh" th:value="${product.hinhAnh}" />

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên món đồ uống / thức ăn:</label>
                                <input type="text" class="form-control" name="tenSanPham" th:value="${product.tenSanPham}" placeholder="VD: Bạc Xỉu Đá, Bánh Mì..." required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phân loại (Danh mục món):</label>
                                <input class="form-control" list="categoryOptions" name="loai" th:value="${product.loai}" placeholder="Chọn danh mục hoặc tự gõ loại mới..." required autocomplete="off">
                                <datalist id="categoryOptions">
                                    <option th:each="cat : ${categories}" th:value="${cat}"></option>
                                </datalist>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Hình ảnh món:</label>
                                <input type="file" class="form-control" name="imageFile" accept="image/*" onchange="previewImage(event)">
                                <div class="mt-2 text-center" th:if="${product.hinhAnh != null && !#strings.isEmpty(product.hinhAnh)}">
                                    <small class="text-muted d-block mb-1">Ảnh hiện tại:</small>
                                    <img id="imagePreview" th:src="${product.hinhAnh}" class="rounded border" style="max-height: 120px; max-width: 100%; object-fit: cover;" alt="Ảnh món">
                                </div>
                                <div class="mt-2 text-center" th:if="${product.hinhAnh == null || #strings.isEmpty(product.hinhAnh)}">
                                    <img id="imagePreview" src="#" class="rounded border d-none" style="max-height: 120px; max-width: 100%; object-fit: cover;" alt="Xem trước ảnh">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Kích cỡ (Size):</label>
                                <select class="form-select" name="kichCo">
                                    <option value="M" th:selected="${product.kichCo == 'M'}">Size M (Mặc định)</option>
                                    <option value="S" th:selected="${product.kichCo == 'S'}">Size S (Nhỏ)</option>
                                    <option value="L" th:selected="${product.kichCo == 'L'}">Size L (Lớn)</option>
                                    <option value="Standard" th:selected="${product.kichCo == 'Standard'}">Tiêu chuẩn</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Đơn giá (VNĐ):</label>
                                <input type="number" step="1000" min="0" class="form-control" name="gia" th:value="${product.gia}" placeholder="VD: 45000" required>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/products}" class="btn btn-outline-secondary">Quay lại</a>
                                <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
